[project]
name = "api-dileepa-dev"
version = "2.0.0"
description = "This API provides access to Dileepa Bandara's personal and other related data."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Dileepa Bandara", email = "contact@dileepa.dev" }]

dependencies = [
    "fastapi[standard]>=0.141.0,<0.142.0",
    "pydantic>=2.13.0,<2.14.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "uvicorn[standard]>=0.52.0,<0.53.0",
    "pymongo>=4.15.0,<5.0.0",
    "pyjwt>=2.10.0,<3.0.0",
    "pwdlib[argon2,bcrypt]>=0.2.1,<0.3.0",
    "slowapi>=0.1.9,<0.2.0",
    "cloudinary>=1.44.0,<2.0.0",
    "resend>=2.0.0,<3.0.0",
]

[project.urls]
Homepage = "https://api.dileepa.dev"
Repository = "https://github.com/dileepadev/api-dileepa-dev"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "types-python-dateutil>=2.9.0",
]

# FastAPI Cloud reads the entrypoint from here. `app/main.py` is a standard
# location, so this is belt-and-braces against a future layout change.
[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ASYNC",
    "S",    # flake8-bandit
    "RUF",
]
ignore = [
    "B008",  # FastAPI depends on function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and dummy secrets are the point
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["cloudinary.*", "slowapi.*", "resend.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.coverage.run]
source = ["app"]
