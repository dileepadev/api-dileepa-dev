name: Deploy

# `main` is the release branch, so every merge into it is a release and the
# deploy follows it. This was `workflow_dispatch` with a typed confirmation
# through the cutover, when the deploy was one-way and there was nothing behind
# it to fall back to; that gate cost a manual step on every release to guard a
# risk that ended when the cutover was verified.
#
# `workflow_dispatch` stays, because configuration lives in FastAPI Cloud rather
# than in this repository: a `fastapi cloud env set` needs a redeploy to take
# effect and produces no commit to trigger one.
#
# FastAPI Cloud has no preview or per-branch environments, so this deploys the
# one production app that serves `api.dileepa.dev`. README "Deployment" has the
# full order.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One app, one environment: two deploys running at once race on the same target.
# Queue rather than cancel — a half-written deploy is worse than a late one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# The deploy authenticates to FastAPI Cloud with its own token; it needs no
# write access to the repository itself.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to FastAPI Cloud
    runs-on: ubuntu-latest
    # `production` is the only deployment environment this repository uses, and
    # the name is deliberate: GitHub groups the Deployments page by it, so a
    # second name would split one service's history across two headings.
    # `url` makes the entry link to the live API rather than being a bare label.
    environment:
      name: production
      url: https://api.dileepa.dev
    steps:
      # Full history: the deploy packages the working tree, and a shallow clone
      # has bitten version detection before. Matches FastAPI Cloud's own
      # documented workflow.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      # Set with `fastapi cloud setup-ci`, which writes both repository secrets.
      # Application configuration is not set here — it lives in FastAPI Cloud,
      # managed with `fastapi cloud env set`, and a change there needs a
      # redeploy to take effect.
      #
      # `fastapi deploy` is non-interactive when both variables are present:
      # the token authenticates and the app id names the target, so nothing
      # prompts. The CLI comes from `fastapi[standard]`, already locked.
      - name: Deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: uv run fastapi deploy
